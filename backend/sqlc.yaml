version: "2"
sql:
  - engine: postgresql
    schema: schema
    queries: "queries/*.sql"
    gen:
      go:
        package: sqlcstore
        out: internal/store/sqlc
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: false
        overrides:
          - db_type: "pg_catalog.int8"
            go_type: "uint64"
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "pg_catalog.int2"
            go_type: "int16"
          - db_type: "pg_catalog.bool"
            go_type: "bool"
          - db_type: "uuid"
            go_type: "string"
          - db_type: "pg_catalog.numeric"
            go_type: "string"
