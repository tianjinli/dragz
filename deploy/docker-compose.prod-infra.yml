# Production infrastructure for Dragz.
#
# PostgreSQL and Redis run on the host, OUTSIDE of k3s, so the cluster can be
# rebuilt without touching data. k3s pods reach them through selector-less
# Services whose Endpoints point at the node IP (see k3s/external-db.yaml).
#
# Start:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod-infra.yml up -d
#
# The SQL files only run when the postgres data directory is empty (first boot).
# Never delete /data/dragz/pg to "upgrade" — take a pg_dump first.

# Explicit project name — the directory is called "deploy", which other stacks
# on the same host also use, and `down` removes containers by project label.
name: dragz-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: dragz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_BIND_IP}:5432:5432"
    volumes:
      - /data/dragz/pg:/var/lib/postgresql/data
      # Init scripts run only on first empty volume.
      - ../backend/migrations/001_system_init.sql:/docker-entrypoint-initdb.d/001_system_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    container_name: dragz-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${DB_BIND_IP}:6379:6379"
    volumes:
      - /data/dragz/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
