apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: admin@cszqq.top
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # DNS-01 via Alibaba Cloud DNS. Requires:
      #   1. the alidns-webhook installed in cert-manager namespace
      #      (see deploy/k3s/README.md), and
      #   2. Secret alidns-secret in cert-manager namespace with
      #      access-key-id / access-key-secret.
      # HTTP-01 is unusable here because overseas resolvers still see a stale
      # record pointing at 43.174.224.0/24 (Alibaba Singapore).
      - dns01:
          webhook:
            groupName: acme.cszqq.top
            solverName: alidns
            config:
              region: "cn-hangzhou"
              accessKeyIdRef:
                name: alidns-secret
                key: access-key-id
              accessKeySecretRef:
                name: alidns-secret
                key: access-key-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragz-tls
  namespace: dragz-prod
spec:
  secretName: dragz-tls
  duration: 2160h
  renewBefore: 360h
  commonName: diy.cszqq.top
  dnsNames:
    - diy.cszqq.top
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
