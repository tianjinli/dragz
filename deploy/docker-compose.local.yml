services:
  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-web
    ports:
      - "127.0.0.1:5279:80"
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
